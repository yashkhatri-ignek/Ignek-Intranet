info:
    description: "EmployeeRest REST API"
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: "EmployeeRest"
    version: v1.0
openapi: 3.0.1

paths:
    /employees:
        get:
            operationId: getEmployees
            summary: Get all employees
            responses:
                "200":
                    description: List of employees
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Employee"
                        application/xml:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Employee"
        post:
            operationId: postEmployee
            summary: Create a new employee
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Employee'
                    application/xml:
                        schema:
                            $ref: '#/components/schemas/Employee'
            responses:
                '200':
                    description: Employee created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Employee'
                        application/xml:
                            schema:
                                $ref: '#/components/schemas/Employee'
                "404":
                    description: Employee not create

    /employees/{employeeId}:
        get:
            operationId: getEmployee
            summary: Get employee by ID
            parameters:
                - name: employeeId
                  in: path
                  required: true
                  schema:
                      type: integer
                      format: int64
            responses:
                "200":
                    description: Employee details
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Employee"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Employee"
                "404":
                    description: Employee not found

        put:
            operationId: putEmployee
            summary: Update employee
            parameters:
                - name: employeeId
                  in: path
                  required: true
                  schema:
                      type: integer
                      format: int64
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/Employee"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/Employee"
            responses:
                "200":
                    description: Employee updated
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Employee"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Employee"
                "404":
                    description: Employee not found

        delete:
            operationId: deleteEmployee
            summary: Delete employee
            parameters:
                - name: employeeId
                  in: path
                  required: true
                  schema:
                      type: integer
                      format: int64
            responses:
                "200":
                    description: Employee deleted successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Employee"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Employee"

components:
    schemas:
        Employee:
            type: object
            properties:
                employeeId:
                    type: integer
                    format: int64
                firstName:
                    type: string
                lastName:
                    type: string
                emailAddress:
                    type: string
                phoneNumber:
                    type: string
                addressLine1:
                    type: string
                addressLine2:
                    type: string
                city:
                    type: string
                zipCode:
                    type: string
                designation:
                    type: string